<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>拾光·宠物</title>
    <style>
      /* 宠物窗口：frameless + transparent，根容器必须无白底。
         左键拖动走系统级 -webkit-app-region: drag（OS 层拖动，注意：拖动区会吞掉
         左键的 click/mousedown 等全部 DOM 事件，左键点击互动不可用）；
         唤出输入框改用右键 contextmenu（不受拖动区拦截）。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #app {
        width: 128px;
        height: 104px;
        background: transparent;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
